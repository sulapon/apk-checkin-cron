name: APK.TW Check-in

on:
  schedule:
    # Every hour (GitHub cron is UTC; TZ env aligns the check-in day)
    - cron: "0 * * * *"
  workflow_dispatch:   # manual trigger for testing

env:
  TZ: "Asia/Taipei"

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (tesseract for OCR fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev
          tesseract --version | head -1

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          python -c "import playwright, ddddocr, PIL; print('deps OK')"

      - name: Install Chrome + playwright chromium (fallback)
        run: |
          sudo apt-get install -y google-chrome-stable || true
          python -m playwright install chromium --with-deps || true
          which google-chrome || echo "chrome not found (falling back to chromium)"

      - name: Restore session cookies (cache)
        uses: actions/cache/restore@v4
        with:
          path: .session
          # Runner-local session refresh; secrets remain the bootstrap source.
          key: apk-session-${{ github.run_id }}
          restore-keys: apk-session-

      - name: Run check-in
        env:
          APK_USER_1: ${{ secrets.APK_USER_1 }}
          APK_PASS_1: ${{ secrets.APK_PASS_1 }}
          APK_USER_2: ${{ secrets.APK_USER_2 }}
          APK_PASS_2: ${{ secrets.APK_PASS_2 }}
          APK_COOKIES_1: ${{ secrets.APK_COOKIES_1 }}
          APK_COOKIES_2: ${{ secrets.APK_COOKIES_2 }}
          APK_SILENT: "1"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          chmod +x run.sh
          ./run.sh
          echo "exit=$?"

      - name: Save session cookies (cache)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .session
          key: apk-session-${{ github.run_id }}

      - name: Rotate cookie secrets (keep bootstrap fresh)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ROTATE_PAT }}
        run: |
          for N in 1 2; do
            F=".session/cookies_${N}.json"
            if [ -s "$F" ]; then
              B64=$(base64 -w0 "$F")
              if [ "${#B64}" -lt 40000 ]; then
                echo "$B64" | gh secret set "APK_COOKIES_${N}" --repo "$GITHUB_REPOSITORY"
                echo "rotated APK_COOKIES_${N} (${#B64} chars)"
              else
                echo "skip APK_COOKIES_${N}: too large (${#B64})"
              fi
            else
              echo "skip APK_COOKIES_${N}: no fresh cookies this run"
            fi
          done