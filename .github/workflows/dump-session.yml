name: Dump session (temporary)

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore session cookies (cache)
        uses: actions/cache/restore@v4
        with:
          path: .session
          key: apk-session-dump-${{ github.run_id }}
          restore-keys: apk-session-
      - name: Upload session dir as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-session
          path: .session